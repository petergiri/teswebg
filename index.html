<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Gereja</title>
</head>
<body>
<!-- ===============================================
     HALAMAN PUBLIK WEBSITE GEREJA (untuk jemaat)
     ===============================================
     Halaman ini HANYA menampilkan data (read-only).
     Untuk kelola data, gunakan admin.html secara terpisah
     (jangan ditautkan di halaman ini agar pengunjung umum
     tidak menemukannya).

     Cara pakai: isi APPS_SCRIPT_URL di bawah dengan URL
     Web App yang SAMA dengan yang dipakai di admin.html.
-->
<div id="site">
  <header class="site-header">
    <h1>Nama Gereja</h1>
    <p class="tagline">Selamat datang di website kami</p>
  </header>

  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <section id="sec-streaming" class="section">
      <h2>Ibadah Live / Terjadwal</h2>
      <div id="streaming-list" class="card-list"></div>
    </section>

    <section id="sec-jadwal" class="section">
      <h2>Jadwal Ibadah & Kegiatan</h2>
      <div id="jadwal-list" class="card-list"></div>
    </section>

    <section id="sec-renungan" class="section">
      <h2>Renungan</h2>
      <div id="renungan-list" class="card-list"></div>
    </section>

    <section id="sec-dokumentasi" class="section">
      <h2>Dokumentasi Kegiatan</h2>
      <div id="dokumentasi-list" class="card-list grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Nama Gereja</p>
  </footer>
</div>

<style>
  #site {
    --ink: #1F3B33;
    --paper: #FAF8F3;
    --panel: #FFFFFF;
    --accent: #2F6B57;
    --accent-dark: #1F4A3C;
    --gold: #B8873A;
    --line: #E4DFD3;
    --muted: #6B7A74;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
  }

  .site-header {
    background: var(--accent-dark);
    color: #fff;
    text-align: center;
    padding: 48px 20px 36px;
  }
  .site-header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px;
    margin: 0 0 6px;
  }
  .site-header .tagline { margin: 0; opacity: 0.85; font-size: 15px; }

  .site-nav {
    display: flex;
    justify-content: center;
    gap: 4px;
    background: var(--accent);
    flex-wrap: wrap;
  }
  .site-nav a {
    color: #fff;
    text-decoration: none;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.9;
  }
  .site-nav a:hover { opacity: 1; background: rgba(255,255,255,0.1); }

  main { max-width: 860px; margin: 0 auto; padding: 40px 20px; }

  .section { margin-bottom: 48px; }
  .section h2 {
    font-family: Georgia, serif;
    font-size: 22px;
    color: var(--accent-dark);
    border-bottom: 2px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }

  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .card-list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent-dark); }
  .card .meta { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .card p { margin: 0; font-size: 14.5px; }
  .card a.link-btn {
    display: inline-block;
    margin-top: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .card a.link-btn:hover { text-decoration: underline; }

  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    background: #EAF2EE;
    color: var(--accent-dark);
    margin-bottom: 6px;
  }
  .badge.live { background: #FBEAE7; color: #A6483C; }

  .doc-card { padding: 0; overflow: hidden; }
  .doc-card .doc-thumb {
    width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--line);
  }
  .doc-card .doc-body { padding: 12px 14px; }

  .empty-note { color: var(--muted); font-size: 14px; font-style: italic; }

  .site-footer {
    text-align: center;
    padding: 24px 20px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 640px) {
    .site-header h1 { font-size: 26px; }
    main { padding: 28px 16px; }
  }
</style>

<script>
(function () {
  // GANTI dengan URL Web App yang SAMA seperti di admin.html
  const APPS_SCRIPT_URL ='https://script.google.com/macros/s/AKfycbwWTGCBuZm2puq7lxet2BVRgLXDWBGddvER3Uyzxahl05T1-IK8j2VjaXfoz9bVsJrXNA/exec';

  const SECTIONS = [
    { id: 'streaming', label: 'Live/Jadwal', anchor: '#sec-streaming' },
    { id: 'jadwal', label: 'Jadwal', anchor: '#sec-jadwal' },
    { id: 'renungan', label: 'Renungan', anchor: '#sec-renungan' },
    { id: 'dokumentasi', label: 'Dokumentasi', anchor: '#sec-dokumentasi' }
  ];

  function init() {
    document.getElementById('year').textContent = new Date().getFullYear();
    renderNav();
    loadSheet('streaming', renderStreaming);
    loadSheet('jadwal', renderJadwal);
    loadSheet('renungan', renderRenungan);
    loadSheet('dokumentasi', renderDokumentasi);
  }

  function renderNav() {
    const nav = document.getElementById('site-nav');
    SECTIONS.forEach(function (s) {
      const a = document.createElement('a');
      a.href = s.anchor;
      a.textContent = s.label;
      nav.appendChild(a);
    });
  }

  function loadSheet(sheetName, renderFn) {
    fetch(APPS_SCRIPT_URL + '?sheet=' + sheetName + '&_=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Gagal memuat');
        renderFn(json.data);
      })
      .catch(function (err) {
        document.getElementById(sheetName + '-list').innerHTML =
          '<p class="empty-note">Belum bisa memuat data saat ini.</p>';
      });
  }

  function emptyIfNone(container, data, msg) {
    if (!data || data.length === 0) {
      container.innerHTML = '<p class="empty-note">' + msg + '</p>';
      return true;
    }
    return false;
  }

  function renderStreaming(data) {
    const el = document.getElementById('streaming-list');
    el.innerHTML = '';
    if (emptyIfNone(el, data, 'Belum ada jadwal siaran saat ini.')) return;

    data.forEach(function (row) {
      const isLive = row.status === 'Live sekarang';
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<span class="badge' + (isLive ? ' live' : '') + '">' + escapeHtml(row.status || 'Terjadwal') + '</span>' +
        '<h3>' + escapeHtml(row.nama_ibadah) + '</h3>' +
        '<p class="meta">' + escapeHtml(formatDate(row.tanggal)) + '</p>' +
        (row.link_youtube ? '<a class="link-btn" href="' + escapeAttr(row.link_youtube) + '" target="_blank" rel="noopener">Tonton di YouTube &rarr;</a>' : '');
      el.appendChild(card);
    });
  }

  function renderJadwal(data) {
    const el = document.getElementById('jadwal-list');
    el.innerHTML = '';
    if (emptyIfNone(el, data, 'Belum ada jadwal kegiatan.')) return;

    data.forEach(function (row) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<h3>' + escapeHtml(row.nama_kegiatan) + '</h3>' +
        '<p class="meta">' + escapeHtml(formatDate(row.tanggal)) + (row.jam ? ' &middot; ' + escapeHtml(row.jam) : '') +
          (row.tempat ? ' &middot; ' + escapeHtml(row.tempat) : '') + '</p>' +
        (row.keterangan ? '<p>' + escapeHtml(row.keterangan) + '</p>' : '');
      el.appendChild(card);
    });
  }

  function renderRenungan(data) {
    const el = document.getElementById('renungan-list');
    el.innerHTML = '';
    const published = (data || []).filter(function (row) { return row.status === 'Terbit'; });
    if (emptyIfNone(el, published, 'Belum ada renungan yang diterbitkan.')) return;

    published.forEach(function (row) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<h3>' + escapeHtml(row.judul) + '</h3>' +
        '<p class="meta">' + escapeHtml(row.penulis || '') + (row.tanggal_terbit ? ' &middot; ' + escapeHtml(formatDate(row.tanggal_terbit)) : '') + '</p>' +
        '<p>' + escapeHtml(row.isi) + '</p>';
      el.appendChild(card);
    });
  }

  function renderDokumentasi(data) {
    const el = document.getElementById('dokumentasi-list');
    el.innerHTML = '';
    if (emptyIfNone(el, data, 'Belum ada dokumentasi.')) return;

    data.forEach(function (row) {
      const card = document.createElement('div');
      card.className = 'card doc-card';
      const thumbSrc = row.thumbnail || '';
      card.innerHTML =
        (thumbSrc ? '<img class="doc-thumb" src="' + escapeAttr(thumbSrc) + '" alt="">' : '') +
        '<div class="doc-body">' +
          '<span class="badge">' + escapeHtml(row.tipe || 'Foto') + '</span>' +
          '<h3>' + escapeHtml(row.judul_kegiatan) + '</h3>' +
          '<p class="meta">' + escapeHtml(formatDate(row.tanggal)) + '</p>' +
          (row.link_media ? '<a class="link-btn" href="' + escapeAttr(row.link_media) + '" target="_blank" rel="noopener">Lihat &rarr;</a>' : '') +
        '</div>';
      el.appendChild(card);
    });
  }

  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  init();
})();
</script>
</body>
</html>
