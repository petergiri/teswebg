<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin Website Gereja</title>
</head>
<body>
<!-- ===============================================
     PANEL ADMIN WEBSITE MINISTRY GEREJA
     ===============================================
     Cara pakai:
     1. Isi APPS_SCRIPT_URL di bawah dengan URL Web App
        dari Google Apps Script (lihat instruksi di code.gs)
     2. Buka file ini di browser, atau upload ke GitHub Pages
     3. Admin gereja bisa langsung Tambah/Ubah/Hapus data
        dari tampilan ini tanpa perlu tahu coding
-->
<div id="admin-app">
  <header class="app-header">
    <h1>Panel Admin Website Gereja</h1>
    <p class="subtitle">Kelola jadwal, renungan, dokumentasi, dan siaran ibadah</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <div class="toolbar">
      <button id="btn-add" class="btn btn-primary">+ Tambah Baru</button>
      <span id="status-msg" class="status-msg"></span>
    </div>

    <div id="table-wrap">
      <table id="data-table">
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
      <p id="empty-msg" class="empty-msg" hidden>Belum ada data. Klik "+ Tambah Baru" untuk mulai.</p>
    </div>
  </main>

  <!-- Modal form tambah/edit -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-title">Tambah Data</h2>
      <form id="data-form"></form>
      <div class="modal-actions">
        <button type="button" id="btn-cancel" class="btn btn-secondary">Batal</button>
        <button type="submit" form="data-form" class="btn btn-primary">Simpan</button>
      </div>
    </div>
  </div>
</div>

<style>
  #admin-app {
    --ink: #1F3B33;
    --paper: #FAF8F3;
    --panel: #FFFFFF;
    --accent: #2F6B57;
    --accent-dark: #1F4A3C;
    --gold: #B8873A;
    --line: #E4DFD3;
    --danger: #A6483C;
    --muted: #6B7A74;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    line-height: 1.5;
  }

  .app-header { border-bottom: 2px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
  .app-header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-dark);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .subtitle { margin: 0; color: var(--muted); font-size: 14.5px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 16px;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover { color: var(--accent-dark); }
  .tab-btn.active { color: var(--accent-dark); border-bottom-color: var(--gold); }

  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .status-msg { font-size: 13.5px; color: var(--accent); font-weight: 600; }
  .status-msg.error { color: var(--danger); }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn-secondary:hover { background: var(--paper); }
  .btn-icon {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .btn-icon.edit { color: var(--accent-dark); }
  .btn-icon.edit:hover { background: #EAF2EE; }
  .btn-icon.delete { color: var(--danger); }
  .btn-icon.delete:hover { background: #F6E9E7; }

  #table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { background: #F1EEE5; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FBFAF6; }
  th { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .col-actions { white-space: nowrap; width: 1%; }

  .empty-msg { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14.5px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(31, 59, 51, 0.45);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--panel); border-radius: 12px; padding: 24px;
    width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 16px; font-family: Georgia, serif; color: var(--accent-dark); font-size: 20px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--ink); }
  .field input, .field textarea, .field select {
    width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 7px; font-family: inherit; background: var(--paper);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--accent); background: #fff;
  }
  .field textarea { min-height: 90px; resize: vertical; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  @media (max-width: 640px) {
    #admin-app { padding: 20px 14px 40px; }
    th, td { padding: 10px 8px; font-size: 13px; }
    .col-hide-mobile { display: none; }
  }
</style>

<script>
(function () {
  // ============ KONFIGURASI ============
  // GANTI dengan URL Web App dari Apps Script kamu (Deploy > New deployment)
  const APPS_SCRIPT_URL = 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT';

  // Definisi setiap jenis data: label tab, kolom, tipe input, label field
  const CONFIG = {
    jadwal: {
      label: 'Jadwal',
      fields: [
        { key: 'nama_kegiatan', label: 'Nama Kegiatan', type: 'text', required: true },
        { key: 'tanggal', label: 'Tanggal', type: 'date', required: true },
        { key: 'jam', label: 'Jam', type: 'time' },
        { key: 'tempat', label: 'Tempat', type: 'text' },
        { key: 'keterangan', label: 'Keterangan', type: 'textarea' }
      ],
      columns: ['nama_kegiatan', 'tanggal', 'jam', 'tempat']
    },
    renungan: {
      label: 'Renungan',
      fields: [
        { key: 'judul', label: 'Judul', type: 'text', required: true },
        { key: 'penulis', label: 'Penulis', type: 'text' },
        { key: 'tanggal_terbit', label: 'Tanggal Terbit', type: 'date' },
        { key: 'isi', label: 'Isi Renungan', type: 'textarea', required: true },
        { key: 'status', label: 'Status', type: 'select', options: ['Draft', 'Terbit'] }
      ],
      columns: ['judul', 'penulis', 'tanggal_terbit', 'status']
    },
    dokumentasi: {
      label: 'Dokumentasi',
      fields: [
        { key: 'judul_kegiatan', label: 'Judul Kegiatan', type: 'text', required: true },
        { key: 'tanggal', label: 'Tanggal', type: 'date' },
        { key: 'tipe', label: 'Tipe', type: 'select', options: ['Foto', 'Video'] },
        { key: 'link_media', label: 'Link Media (Google Drive/Photos)', type: 'text', required: true },
        { key: 'thumbnail', label: 'Link Gambar Sampul (opsional)', type: 'text' }
      ],
      columns: ['judul_kegiatan', 'tanggal', 'tipe']
    },
    streaming: {
      label: 'Streaming',
      fields: [
        { key: 'nama_ibadah', label: 'Nama Ibadah', type: 'text', required: true },
        { key: 'tanggal', label: 'Tanggal', type: 'date' },
        { key: 'link_youtube', label: 'Link YouTube', type: 'text', required: true },
        { key: 'status', label: 'Status', type: 'select', options: ['Terjadwal', 'Live sekarang', 'Sudah lewat'] }
      ],
      columns: ['nama_ibadah', 'tanggal', 'status']
    }
  };

  const SHEET_KEYS = Object.keys(CONFIG);
  let activeSheet = SHEET_KEYS[0];
  let currentData = [];
  let editingId = null;

  // ============ ELEMEN ============
  const tabsEl = document.getElementById('tabs');
  const tableHead = document.getElementById('table-head');
  const tableBody = document.getElementById('table-body');
  const emptyMsg = document.getElementById('empty-msg');
  const statusMsg = document.getElementById('status-msg');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const dataForm = document.getElementById('data-form');

  // ============ INIT ============
  function init() {
    renderTabs();
    loadData();

    document.getElementById('btn-add').addEventListener('click', function () { openModal(null); });
    document.getElementById('btn-cancel').addEventListener('click', closeModal);
    dataForm.addEventListener('submit', handleSubmit);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    SHEET_KEYS.forEach(function (key) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (key === activeSheet ? ' active' : '');
      btn.textContent = CONFIG[key].label;
      btn.addEventListener('click', function () {
        activeSheet = key;
        renderTabs();
        loadData();
      });
      tabsEl.appendChild(btn);
    });
  }

  // ============ AMBIL DATA ============
  function loadData() {
    setStatus('Memuat data...', false);
    fetch(APPS_SCRIPT_URL + '?sheet=' + activeSheet)
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Gagal memuat data');
        currentData = json.data;
        renderTable();
        setStatus('', false);
      })
      .catch(function (err) {
        setStatus('Gagal memuat data: ' + err.message, true);
      });
  }

  // ============ TABEL ============
  function renderTable() {
    const cfg = CONFIG[activeSheet];
    tableHead.innerHTML = '';
    cfg.columns.forEach(function (col) {
      const th = document.createElement('th');
      th.textContent = fieldLabel(cfg, col);
      tableHead.appendChild(th);
    });
    const thAction = document.createElement('th');
    thAction.textContent = 'Aksi';
    thAction.className = 'col-actions';
    tableHead.appendChild(thAction);

    tableBody.innerHTML = '';
    emptyMsg.hidden = currentData.length !== 0;

    currentData.forEach(function (row) {
      const tr = document.createElement('tr');
      cfg.columns.forEach(function (col) {
        const td = document.createElement('td');
        td.textContent = row[col] || '-';
        tr.appendChild(td);
      });
      const tdAction = document.createElement('td');
      tdAction.className = 'col-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-icon edit';
      editBtn.textContent = 'Ubah';
      editBtn.addEventListener('click', function () { openModal(row); });

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-icon delete';
      delBtn.textContent = 'Hapus';
      delBtn.addEventListener('click', function () { handleDelete(row.id); });

      tdAction.appendChild(editBtn);
      tdAction.appendChild(delBtn);
      tr.appendChild(tdAction);
      tableBody.appendChild(tr);
    });
  }

  function fieldLabel(cfg, key) {
    const f = cfg.fields.find(function (f) { return f.key === key; });
    return f ? f.label : key;
  }

  // ============ FORM MODAL ============
  function openModal(row) {
    const cfg = CONFIG[activeSheet];
    editingId = row ? row.id : null;
    modalTitle.textContent = row ? 'Ubah ' + cfg.label : 'Tambah ' + cfg.label;

    dataForm.innerHTML = '';
    cfg.fields.forEach(function (f) {
      const wrap = document.createElement('div');
      wrap.className = 'field';

      const label = document.createElement('label');
      label.textContent = f.label + (f.required ? ' *' : '');
      label.setAttribute('for', 'f-' + f.key);
      wrap.appendChild(label);

      let input;
      if (f.type === 'textarea') {
        input = document.createElement('textarea');
      } else if (f.type === 'select') {
        input = document.createElement('select');
        f.options.forEach(function (opt) {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          input.appendChild(o);
        });
      } else {
        input = document.createElement('input');
        input.type = f.type;
      }
      input.id = 'f-' + f.key;
      input.name = f.key;
      if (f.required) input.required = true;
      if (row && row[f.key] !== undefined) input.value = row[f.key];

      wrap.appendChild(input);
      dataForm.appendChild(wrap);
    });

    modalOverlay.hidden = false;
  }

  function closeModal() {
    modalOverlay.hidden = true;
    editingId = null;
  }

  function handleSubmit(e) {
    e.preventDefault();
    const cfg = CONFIG[activeSheet];
    const data = {};
    cfg.fields.forEach(function (f) {
      data[f.key] = document.getElementById('f-' + f.key).value;
    });

    const payload = editingId
      ? { sheet: activeSheet, action: 'update', id: editingId, data: data }
      : { sheet: activeSheet, action: 'create', data: data };

    setStatus('Menyimpan...', false);
    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Gagal menyimpan');
        closeModal();
        setStatus('Data tersimpan.', false);
        loadData();
      })
      .catch(function (err) {
        setStatus('Gagal menyimpan: ' + err.message, true);
      });
  }

  // ============ HAPUS ============
  function handleDelete(id) {
    if (!confirm('Yakin ingin menghapus data ini?')) return;
    setStatus('Menghapus...', false);
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ sheet: activeSheet, action: 'delete', id: id })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || 'Gagal menghapus');
        setStatus('Data dihapus.', false);
        loadData();
      })
      .catch(function (err) {
        setStatus('Gagal menghapus: ' + err.message, true);
      });
  }

  function setStatus(msg, isError) {
    statusMsg.textContent = msg;
    statusMsg.className = 'status-msg' + (isError ? ' error' : '');
  }

  init();
})();
</script>
</body>
</html>
